<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Bracas Company</title>
  <!-- Asegúrate de que esta ruta apunte a tu CSS compilado -->
  <link rel="stylesheet" href="tu-archivo.css">
</head>
<body>

  <div class="landing-container">
    
    <!-- CONTENEDOR HERO PRINCIPAL -->
    <header class="hero">
      
      <!-- Fondo con la imagen del logo -->
      <div class="hero-background"></div>
      
      <!-- Bloque de contenido con las dos columnas de botones -->
      <div class="hero-content">
        
        <!-- COLUMNA IZQUIERDA (Ajustable con btn-izq-X) -->
        <div class="cta-buttons-left">
          <button class="btn-glass btn-izq-1">Inicio</button>
          <button class="btn-glass btn-izq-2">Servicios</button>
          <button class="btn-glass btn-izq-3">Galería</button>
        </div>
        
        <!-- COLUMNA DERECHA (Ajustable con btn-der-X) -->
        <div class="cta-buttons-right">
          <button class="btn-glass btn-der-1">Contacto</button>
          <button class="btn-glass btn-der-2">Tienda</button>
          <button class="btn-glass btn-der-3">Soporte</button>
        </div>
        
      </div>

      <!-- Banner blanco inferior visible en móviles -->
      <div class="hero-footer-banner">
        <span>Bracas Company</span>
      </div>

    </header>

    <!-- SECCIÓN DE PROMOCIÓN -->
    <section class="promo-banner">
      <h2>Descubre nuestras promociones exclusivas</h2>
    </section>

    <!-- SECCIÓN DE PRODUCTOS -->
    <section class="featured-products">
      <div class="section-header">
        <a href="#productos">Ver todos los productos destacados</a>
      </div>
      
      <div class="product-grid">
        <!-- Tarjeta de ejemplo 1 -->
        <div class="product-card">
          <div class="product-image">
            <span class="badge">Nuevo</span>
            <img src="https://placeholder.com" alt="Producto de ejemplo">
          </div>
        </div>
        <!-- Tarjeta de ejemplo 2 -->
        <div class="product-card">
          <div class="product-image">
            <span class="badge">Oferta</span>
            <img src="https://placeholder.com" alt="Producto de ejemplo">
          </div>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
