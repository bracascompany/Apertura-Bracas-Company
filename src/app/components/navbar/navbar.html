<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-[#010c06]/95 backdrop-blur-md border-b border-emerald-500/20 shadow-[0_4px_30px_rgba(0,0,0,0.8)]">
  <div class="max-w-7xl mx-auto px-6 sm:px-8 h-16 sm:h-20 flex items-center justify-between">
    <!-- Logo / Brand con la imagen translúcida del chatbot -->
    <a href="#" class="flex items-center gap-2 sm:gap-3 group">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center overflow-hidden group-hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,255,136,0.3)]">
        <img src="assets/chatbot.jpeg" alt="Bracas Company Logo" class="w-full h-full object-cover mix-blend-screen opacity-95">
      </div>
      <span class="font-display font-bold text-lg sm:text-xl tracking-tight text-white">
        Bracas<span class="text-emerald-400">company</span>
      </span>
    </a>

    <!-- Navigation Links para Computador (Escritorio) -->
    <nav class="hidden md:flex items-center gap-6 lg:gap-8 text-base font-semibold">
      <a routerLink="/nosotros" class="relative text-gray-300 hover:text-emerald-400 transition-colors py-1 group">
        <span>Nosotros</span>
        <span class="absolute bottom-0 left-0 w-0 h-[3px] bg-emerald-400 shadow-[0_0_12px_rgba(0,255,136,1)] transition-all duration-300 group-hover:w-full rounded-full"></span>
      </a>
      <a routerLink="/unidades" class="relative text-gray-300 hover:text-emerald-400 transition-colors py-1 group">
        <span>Unidades</span>
        <span class="absolute bottom-0 left-0 w-0 h-[3px] bg-emerald-400 shadow-[0_0_12px_rgba(0,255,136,1)] transition-all duration-300 group-hover:w-full rounded-full"></span>
      </a>
      <a href="#soluciones" class="relative text-gray-300 hover:text-emerald-400 transition-colors py-1 group">
        <span>Soluciones</span>
        <span class="absolute bottom-0 left-0 w-0 h-[3px] bg-emerald-400 shadow-[0_0_12px_rgba(0,255,136,1)] transition-all duration-300 group-hover:w-full rounded-full"></span>
      </a>
      <a routerLink="/fundacion-segat" class="relative text-gray-300 hover:text-emerald-400 transition-colors py-1 group">
        <span>Impacto SEGAT</span>
        <span class="absolute bottom-0 left-0 w-0 h-[3px] bg-emerald-400 shadow-[0_0_12px_rgba(0,255,136,1)] transition-all duration-300 group-hover:w-full rounded-full"></span>
      </a>
      <a routerLink="/contacto" class="relative text-gray-300 hover:text-emerald-400 transition-colors py-1 group">
        <span>Contacto</span>
        <span class="absolute bottom-0 left-0 w-0 h-[3px] bg-emerald-400 shadow-[0_0_12px_rgba(0,255,136,1)] transition-all duration-300 group-hover:w-full rounded-full"></span>
      </a>
    </nav>

    <!-- Acciones (Login + Botón Hamburguesa Móvil) -->
    <div class="flex items-center gap-3">
      <!-- MODIFICADO: Botón de Login con la secuencia de arranque tipo consola -->
      <button (click)="triggerSystemBoot()" class="relative px-4 sm:px-5 py-2 rounded-full text-xs sm:text-sm font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-500/30 hover:bg-emerald-400 hover:text-black hover:shadow-[0_0_20px_rgba(0,255,136,0.6)] transition-all overflow-hidden group cursor-pointer flex items-center gap-2">
        <span class="absolute inset-0 bg-gradient-to-r from-transparent via-emerald-400/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span>Login</span>
      </button>

      <!-- Botón Hamburguesa para Celular -->
      <button (click)="toggleMobileMenu()" class="md:hidden w-10 h-10 rounded-xl bg-emerald-950/60 border border-emerald-500/30 flex items-center justify-center text-emerald-400 focus:outline-none shadow-[0_0_15px_rgba(0,255,136,0.2)]">
        <svg class="w-6 h-6 transition-transform duration-300" [ngClass]="{'rotate-90': isMobileMenuOpen}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Menú Desplegable Móvil (Alineado a la derecha y con color neón) -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden absolute top-full left-0 right-0 bg-[#010c06]/98 backdrop-blur-xl border-b border-emerald-500/30 shadow-[0_20px_40px_rgba(0,0,0,0.9)] px-6 py-6 flex flex-col gap-4 animate-fadeIn text-right">
    <a routerLink="/nosotros" (click)="closeMobileMenu()" class="text-emerald-400 hover:text-white font-semibold text-base py-2 border-b border-emerald-500/10 flex items-center justify-between transition-colors">
      <span class="text-xs text-gray-500">01</span>
      <span>Nosotros</span>
    </a>
    <a routerLink="/unidades" (click)="closeMobileMenu()" class="text-emerald-400 hover:text-white font-semibold text-base py-2 border-b border-emerald-500/10 flex items-center justify-between transition-colors">
      <span class="text-xs text-gray-500">02</span>
      <span>Unidades</span>
    </a>
    <a href="#soluciones" (click)="closeMobileMenu()" class="text-emerald-400 hover:text-white font-semibold text-base py-2 border-b border-emerald-500/10 flex items-center justify-between transition-colors">
      <span class="text-xs text-gray-500">03</span>
      <span>Soluciones</span>
    </a>
    <a routerLink="/fundacion-segat" (click)="closeMobileMenu()" class="text-emerald-400 hover:text-white font-semibold text-base py-2 border-b border-emerald-500/10 flex items-center justify-between transition-colors">
      <span class="text-xs text-gray-500">04</span>
      <span>Impacto SEGAT</span>
    </a>
    <a routerLink="/contacto" (click)="closeMobileMenu()" class="text-emerald-400 hover:text-white font-semibold text-base py-2 flex items-center justify-between transition-colors">
      <span class="text-xs text-gray-500">05</span>
      <span>Contacto</span>
    </a>
  </div>
</header>

<!-- NUEVO: PANTALLA DE ARRANQUE TIPO CONSOLA (Se activa al hacer click en Login) -->
<div *ngIf="isBooting" class="fixed inset-0 z-[9999] bg-[#010c06] flex flex-col items-center justify-center overflow-hidden transition-opacity duration-500">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,255,136,0.25)_0%,transparent_70%)] pointer-events-none animate-pulse"></div>

  <div class="relative flex items-center justify-center w-40 h-40 z-10">
    <div class="absolute inset-0 rounded-full border-4 border-emerald-500/20 border-t-emerald-400 animate-spin shadow-[0_0_35px_rgba(0,255,136,0.6)]"></div>
    <div class="absolute w-28 h-28 rounded-full bg-emerald-950/80 blur-md"></div>
    <img src="assets/loading.png" alt="Bracas Boot" class="w-20 h-20 object-cover mix-blend-screen relative z-20 animate-bounce">
  </div>

  <div class="mt-6 text-center z-10">
    <p class="text-xs text-emerald-400 font-extrabold tracking-[0.4em] uppercase mb-3 animate-pulse">
      ESTABLECIENDO CONEXIÓN SEGURA...
    </p>
    <div class="w-48 h-1.5 bg-emerald-950 rounded-full mx-auto overflow-hidden border border-emerald-500/30">
      <div class="h-full bg-gradient-to-r from-emerald-600 to-emerald-300 animate-loadingBar shadow-[0_0_12px_rgba(0,255,136,0.9)]"></div>
    </div>
  </div>
</div>

<!-- PANTALLA DE ARRANQUE ESTILO PLAYSTATION 2 (LIMPIA Y AMPLIADA) -->
<div *ngIf="isBooting" class="fixed inset-0 z-[9999] bg-[#000502] flex flex-col items-center justify-center overflow-hidden font-sans select-none animate-fadeIn">
  
  <!-- Fondo con gradiente profundo y líneas de escaneo (Scanlines) -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(1,20,10,0.95)_0%,#000301_80%)]"></div>
  <div class="absolute inset-0 opacity-10 bg-[linear-gradient(rgba(18,255,128,0)_50%,rgba(0,255,136,0.2)_50%)] bg-[length:100%_4px] pointer-events-none"></div>

  <!-- Núcleo Central / Logo de Bracas Ampliado y Protagonista -->
  <div class="relative w-56 h-56 flex items-center justify-center z-10">
    <div class="absolute inset-0 rounded-full bg-emerald-500/25 blur-2xl animate-ping"></div>
    <div class="absolute inset-0 rounded-full border-2 border-emerald-400/40 animate-spin shadow-[0_0_50px_rgba(0,255,136,0.6)]" style="animation-duration: 10s;"></div>
    
    <!-- Imagen del logo considerablemente más grande -->
    <img src="assets/loading.png" alt="Bracas System Boot" class="w-36 h-36 object-cover mix-blend-screen relative z-20 drop-shadow-[0_0_25px_rgba(0,255,136,1)] scale-110">
  </div>

  <!-- Texto de estado y bloques de Memory Card -->
  <div class="mt-10 text-center z-20 flex flex-col items-center gap-3">
    <p class="text-xs text-emerald-300/95 tracking-[0.6em] font-mono uppercase drop-shadow-[0_0_10px_rgba(0,255,136,0.9)]">
      BRACAS ECOSYSTEM // MEMORY CARD LOADED
    </p>
    <div class="flex items-center gap-2.5 mt-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping shadow-[0_0_12px_rgba(0,255,136,1)]"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400/70 animate-pulse" style="animation-delay: 0.2s;"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400/40 animate-pulse" style="animation-delay: 0.4s;"></span>
    </div>
  </div>
</div>
