<div class="chatbot-toggle-btn" (click)="toggleChat()">
  <img src="assets/chatbot.jpeg" alt="Bot" class="bot-toggle-logo" />
</div>

<div class="chat-container" *ngIf="isOpen">
  <div class="chat-header">
    <h3>Bracas Company Assistant</h3>
    <button class="close-btn" (click)="toggleChat()">×</button>
  </div>

  <div class="chat-body" #chatBody>
    <div *ngFor="let msg of messages()" class="message-wrapper">
      <div
        class="message-bubble"
        [ngClass]="{ 'bot-msg': msg.sender === 'bot', 'user-msg': msg.sender === 'user' }"
      >
        <p>{{ msg.text }}</p>

        <div *ngIf="$any(msg).botGridButtons" class="bot-grid-buttons">
          <button
            *ngFor="let opt of $any(msg).botGridButtons"
            class="btn-bot-item"
            (click)="selectOption(opt.action)"
          >
            {{ opt.label }}
          </button>
        </div>

        <a
          *ngIf="$any(msg).linkUrl"
          [href]="$any(msg).linkUrl"
          target="_blank"
          class="chat-link-btn"
        >
          {{ $any(msg).linkText || 'Ver más' }}
        </a>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input
      type="text"
      [(ngModel)]="userMessage"
      (keyup.enter)="sendMessage()"
      placeholder="Escribe tu mensaje..."
    />
    <button (click)="sendMessage()">Enviar</button>
  </div>
</div>
