<div class="contacto-container px-4 sm:px-8 font-sans">
  <!-- Resplandor ambiental cibernético -->
  <div class="cyber-glow"></div>

  <div class="max-w-7xl mx-auto relative z-10">
    
    <!-- ENCABEZADO DE SECCIÓN -->
    <div class="mb-12">
      <div class="flex items-center gap-3 mb-2">
        <span class="w-8 h-8 rounded-full bg-emerald-500 text-black font-black flex items-center justify-center text-sm shadow-[0_0_15px_rgba(0,255,136,0.6)]">5</span>
        <span class="text-emerald-400 font-extrabold tracking-widest uppercase text-sm">Despliegue: CONTACTO Y ACCESO</span>
      </div>
      <p class="text-gray-400 text-sm ml-11">Hablemos de tu proyecto</p>
    </div>

    <!-- GRID DE 2 COLUMNAS -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- COLUMNA IZQUIERDA: FORMULARIO -->
      <div class="lg:col-span-7 bg-[#02150a]/90 backdrop-blur-xl border-2 border-emerald-500/40 rounded-3xl p-6 sm:p-8 shadow-[0_0_35px_rgba(0,0,0,0.9)] relative">
        <div class="border-b border-emerald-500/30 pb-4 mb-6">
          <h2 class="text-emerald-400 font-extrabold text-xl tracking-wide flex items-center gap-3">
            <span>✉️</span> Atención y consultas
          </h2>
          <p class="text-gray-300 text-xs sm:text-sm mt-1">Estamos listos para escucharte</p>
        </div>

        <form class="space-y-4" (submit)="$event.preventDefault(); enviarWhatsApp(nombre.value, correo.value, empresa.value, tipo.value, mensaje.value)">
          <div>
            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl px-4 py-3 flex items-center gap-3 shadow-[inset_0_0_10px_rgba(0,255,136,0.05)]">
              <span class="text-emerald-400 text-sm">👤</span>
              <input #nombre type="text" placeholder="Nombre completo" class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-gray-400">
            </div>
          </div>

          <div>
            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl px-4 py-3 flex items-center gap-3 shadow-[inset_0_0_10px_rgba(0,255,136,0.05)]">
              <span class="text-emerald-400 text-sm">✉️</span>
              <input #correo type="email" placeholder="Correo electrónico" class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-gray-400">
            </div>
          </div>

          <div>
            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl px-4 py-3 flex items-center gap-3 shadow-[inset_0_0_10px_rgba(0,255,136,0.05)]">
              <span class="text-emerald-400 text-sm">🏢</span>
              <input #empresa type="text" placeholder="Empresa / Organización" class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-gray-400">
            </div>
          </div>

          <div>
            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl px-4 py-3 flex items-center justify-between shadow-[inset_0_0_10px_rgba(0,255,136,0.05)]">
              <div class="flex items-center gap-3 w-full">
                <span class="text-emerald-400 text-sm">📋</span>
                <select #tipo class="bg-transparent border-none outline-none text-gray-300 text-sm w-full cursor-pointer">
                  <option class="bg-black text-white" value="Atención y consultas">Atención y consultas</option>
                  <option class="bg-black text-white" value="Soporte Técnico Smart Solutions">Soporte Técnico Smart Solutions</option>
                </select>
              </div>
            </div>
          </div>

          <div>
            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-4 shadow-[inset_0_0_10px_rgba(0,255,136,0.05)]">
              <textarea #mensaje rows="3" placeholder="Cuéntanos tu proyecto..." class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-gray-400 resize-none"></textarea>
            </div>
          </div>

          <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-extrabold text-sm tracking-wider uppercase shadow-[0_0_20px_rgba(0,255,136,0.4)] hover:shadow-[0_0_30px_rgba(0,255,136,0.8)] transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span>🚀 ENVIAR MENSAJE</span>
          </button>
        </form>
      </div>

      <!-- COLUMNA DERECHA: CANALES DIRECTOS -->
      <div class="lg:col-span-5 bg-[#02150a]/90 backdrop-blur-xl border-2 border-emerald-500/40 rounded-3xl p-6 sm:p-8 shadow-[0_0_35px_rgba(0,0,0,0.9)] relative space-y-4">
        <div class="border-b border-emerald-500/30 pb-4 mb-2">
          <h2 class="text-emerald-400 font-extrabold text-xl tracking-wide flex items-center gap-3">
            <span>📞</span> Canales directos
          </h2>
          <p class="text-gray-300 text-xs sm:text-sm mt-1">Conecta con la unidad adecuada</p>
        </div>

        <div class="space-y-3">
          <a href="#" class="block bg-emerald-950/40 border border-emerald-500/30 hover:border-emerald-400 p-4 rounded-2xl transition-all group">
            <p class="font-bold text-emerald-300 text-sm group-hover:text-emerald-200 flex items-center gap-2">👥 Directorio de Unidades de Negocio</p>
          </a>
        </div>
      </div>

    </div>

  </div>
</div>
