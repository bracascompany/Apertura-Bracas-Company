<div class="auth-container">
  <!-- Efectos de fondo y scanlines -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(1,20,10,0.8)_0%,#000301_80%)] pointer-events-none"></div>
  <div class="absolute inset-0 opacity-10 bg-[linear-gradient(rgba(18,255,128,0)_50%,rgba(0,255,136,0.2)_50%)] bg-[length:100%_4px] pointer-events-none"></div>

  <!-- Tarjeta de Login Cyber-Neon -->
  <div class="auth-card relative z-10">
    
    <!-- Encabezado -->
    <div class="auth-header">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 mb-3 shadow-[0_0_20px_rgba(0,255,136,0.4)] overflow-hidden">
        <img src="assets/loading.png" alt="Logo" class="w-full h-full object-cover scale-110 drop-shadow-[0_0_10px_rgba(0,255,136,0.8)]">
      </div>
      <h1 class="text-2xl font-bold uppercase tracking-wider">
        Bienvenido de nuevo
      </h1>
      <p class="text-xs tracking-widest uppercase mt-1">
        Ingresa tus credenciales para gestionar tu inventario
      </p>
    </div>

    <!-- Alerta de Error -->
    <div *ngIf="errorMessage" class="error-alert mb-4">
      {{ errorMessage }}
    </div>

    <!-- Formulario Reactivo -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" formControlName="email" placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

  </div>

  <!-- Pie de página técnico -->
  <div class="mt-6 text-center z-10 absolute bottom-6">
    <p class="text-[10px] text-emerald-400/50 tracking-[0.4em] font-mono uppercase">
      BRACAS SECURE ACCESS // SYSTEM SECURED
    </p>
  </div>
</div>
