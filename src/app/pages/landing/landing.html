<div class="landing-container">
  <section class="hero">
    <div class="hero-background"></div>
    <div class="hero-content">
  <div class="circular-menu">
<!-- LADO DERECHO Y ARRIBA (Se ven bien, los dejamos estables) -->
<a class="btn-glass" style="--angle: -90deg;">SOPORTE</a>
<a class="btn-glass" style="--angle: -40deg;">MI CUENTA</a>
<a class="btn-glass" style="--angle: 10deg;">OFERTAS</a>
<a class="btn-glass" style="--angle: 60deg;">C&M STUDIOS</a>

<!-- CENTRO ABAJO (Le bajamos un toque el ángulo) -->
<a class="btn-glass" style="--angle: 110deg;">FUNDACIÓN SEGAT</a>

<!-- LADO IZQUIERDO (Los separamos más entre sí para que no se pisen) -->
<a class="btn-glass" style="--angle: 160deg;">CONTACTOS</a>
<a class="btn-glass" style="--angle: 205deg;">BRACASFOOD</a>
<a class="btn-glass" style="--angle: 245deg;">CATÁLOGO</a>
<a class="btn-glass" style="--angle: 285deg;">UBICACIÓN</a>


</div>
</div>
  </section>

  <div class="promo-banner success-header">
    <h2 class="success-title">
      Casos de éxito <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </h2>
  </div>

  <section class="featured-products">
    <div class="section-header"></div>
    <div class="product-grid">
      <div class="product-card" (click)="goToBracasfood()" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log2.jpeg" alt="Bracasfood" />
        </div>
        <div class="product-info">
          <h3>Bracasfood</h3>
          <div class="price-row">
            <span class="price"></span>
            <button
              class="add-btn"
              (click)="
                $event.stopPropagation(); onAddToCart('Bracasfood', 0000, 'Bracasfood', 'log2.jpeg')
              "
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
