<div class="landing-container">
  <!-- SECCIÓN SUPERIOR: Logo central y botones a los lados -->
  <section class="hero" style="padding: 40px 0;">
    <div class="hero-background"></div>
    <div class="hero-content" style="width: 100%; max-width: 1300px; margin: 0 auto;">
      
      <!-- Menú circular con botones a los lados y la imagen del logo en el centro -->
      <div class="circular-menu" style="display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
        <!-- LADO IZQUIERDO -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <a class="btn-glass" href="/fundacion-segat">FUNDACIÓN SEGAT</a>
          <a class="btn-glass" href="/bracasfood">BRACASFOOD</a>
          <a class="btn-glass" href="/contacto">UBICACIÓN</a>
          <a class="btn-glass" href="/productos">CATÁLOGO</a>
        </div>

        <!-- LOGO CENTRAL CON IMAGEN -->
        <div class="hero-logo-container" style="text-align: center; margin: 0 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <img src="assets/log1.jpeg" alt="Bracas Company Logo" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(34, 197, 94, 0.8); box-shadow: 0 0 25px rgba(34, 197, 94, 0.5);" />
        </div>

        <!-- LADO DERECHO -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <a class="btn-glass" href="/ofertas">OFERTAS</a>
          <a class="btn-glass" href="/soporte">SOPORTE</a>
          <a class="btn-glass" href="/cuenta">MI CUENTA</a>
          <a class="btn-glass" href="/cm-studio">C&M STUDIOS</a>
        </div>
      </div>

      <!-- Título Verde Neón Fluorescente Abajo del Logo y los Botones -->
      <div style="text-align: center; margin-top: 10px;">
        <h2 style="font-family:'Orbitron','Inter',sans-serif!important;font-size:2.8rem!important;font-weight:900!important;letter-spacing:6px!important;text-transform:uppercase!important;margin:0 auto 10px auto!important;display:inline-block!important;background:linear-gradient(90deg, #16a34a 0%, #22c55e 50%, #4ade80 100%)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;filter:drop-shadow(0 0 15px rgba(74,222,128,0.6))!important;">
          BRACAS COMPANY
        </h2>
        <div style="width:80px!important;height:4px!important;background:#16a34a!important;margin:0 auto!important;border-radius:2px!important;box-shadow:0 0 10px #22c55e!important;"></div>
      </div>

    </div>
  </section>

  <!-- SECCIÓN INFERIOR: Las 6 tarjetas en Grid 3x2 -->
  <section class="featured-products">
    <div class="section-header"></div>
    <div class="product-grid">
      
      <!-- 1. Bracasfood -->
      <div class="product-card" (click)="goToBracasfood()" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log2.jpeg" alt="Bracasfood" />
        </div>
        <div class="product-info">
          <h3>Bracasfood</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('Bracasfood', 0, 'Bracasfood', 'log2.jpeg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 2. Brades -->
      <div class="product-card" routerLink="/brades" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log3.jpeg" alt="Brades" />
        </div>
        <div class="product-info">
          <h3>Brades</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('Brades', 0, 'Brades', 'assets/Brades.jpeg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 3. Bracastyles -->
      <div class="product-card" routerLink="/bracas-styles" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log4.jpeg" alt="Bracastyles" />
        </div>
        <div class="product-info">
          <h3>Bracastyles</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('Bracastyles', 0, 'Bracastyles', 'assets/Bracastyles.jpeg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 4. C&M Studios (Justo después de Bracas Styles) -->
      <div class="product-card" routerLink="/cm-studio" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log5.jpeg" alt="Cont&Markets[JB]_Studios" />
        </div>
        <div class="product-info">
          <h3>Cont&Markets[JB]_Studios</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('Cont&Markets[JB]_Studios', 0, 'Cont&Markets[JB]_Studios', 'assets/Cont&Markets[JB]_Studios.jpeg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 5. Fundación SEGAT -->
      <div class="product-card" routerLink="/fundacion-segat" style="cursor: pointer">
        <div class="product-image">
          <img src="assets/log6.jpeg" alt="FundaciónSEGAT" />
        </div>
        <div class="product-info">
          <h3>FundaciónSEGAT</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('FundaciónSEGAT', 0, 'FundaciónSEGAT', 'assets/FundaciónSEGAT.jpeg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 6. Face Brand Digital -->
      <div class="product-card" routerLink="/facebrand-digital" style="cursor: pointer; border: 2px solid rgba(26, 102, 255, 0.6); box-shadow: 0 0 15px rgba(26, 102, 255, 0.3);">
        <div class="product-image">
          <img src="assets/facebranddigitallogo.jpg" alt="FaceBrand Digital" />
        </div>
        <div class="product-info">
          <h3>Face Brand Digital</h3>
          <div class="price-row">
            <span class="price"></span>
            <button class="add-btn" (click)="$event.stopPropagation(); onAddToCart('Face Brand Digital', 0, 'FaceBrand Digital', 'assets/facebranddigitallogo.jpg')">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </section>
</div>
